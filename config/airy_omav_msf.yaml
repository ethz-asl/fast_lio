core/msf_output_frame: lio # Output frame.
core/tf_target_frame: state_lio
core/data_playback: false
core/fixed_bias: 0

######### IMU PARAMETERS #######
core/core_noise_acc: 0.1
core/core_noise_accbias: 0.2
core/core_noise_gyr: 0.015
core/core_noise_gyrbias: 0.02 

######### POSE SENSOR PARAMETERS #######
pose_sensor/fixed_scale: 1.0
pose_sensor/pose_noise_scale: 0.0
pose_sensor/pose_noise_p_wv: 0.0
pose_sensor/pose_noise_q_wv: 0.0
pose_sensor/pose_noise_q_ic: 0.0
pose_sensor/pose_noise_p_ic: 0.0
pose_sensor/pose_delay: 0
pose_sensor/pose_noise_meas_p: 0.005
pose_sensor/pose_noise_meas_q: 0.0005

# ######### EXTRINSICS (PoseSensor) #######
pose_sensor/init/q_ic/x: 0.9976398
pose_sensor/init/q_ic/y: 0.0013471
pose_sensor/init/q_ic/z: 0.0485442
pose_sensor/init/q_ic/w: 0.0485442
pose_sensor/init/p_ic/x: 0
pose_sensor/init/p_ic/y: 0.0426823
pose_sensor/init/p_ic/z: 0.0889862


pose_sensor/pose_fixed_scale: true
pose_sensor/pose_fixed_p_ic: true
pose_sensor/pose_fixed_q_ic: true
pose_sensor/pose_fixed_p_wv: true
pose_sensor/pose_fixed_q_wv: true

pose_sensor/pose_absolute_measurements: true 
pose_sensor/pose_use_fixed_covariance: true
pose_sensor/pose_measurement_world_sensor: true
pose_sensor/pose_sensor/pose_measurement_minimum_dt: 0.005